<style>
:root {
--accent: #ff9500;
--bg: #0a0a0a;
--card: #1a1a1a;
--text: #fff;
--text-muted: #b8b8b8;
--radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  background: var(--bg); 
  color: var(--text); 
  font-family: 'Montserrat', sans-serif; 
  line-height: 1.6;
  padding: 20px;
}
.editor { max-width:1400px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:30px; }
.form-section { background:var(--card); padding:30px; border-radius:var(--radius); height:fit-content; }
.preview { background:#000; border-radius:var(--radius); overflow:hidden; border:2px solid var(--accent); }
h2 { font-size:28px; font-weight:800; margin-bottom:20px; color:var(--accent); }
h3 { font-size:20px; font-weight:700; margin:25px 0 15px 0; }
input, textarea, select { 
  width:100%; padding:12px; border:1px solid #333; border-radius:8px; 
  background:#000; color:#fff; font-family:inherit; font-size:14px;
}
input:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(255,149,0,0.2); }
.group { margin-bottom:20px; }
label { display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px; font-weight:600; }
textarea { resize:vertical; min-height:80px; font-size:14px; }
.btn { 
  background:var(--accent); color:#000; border:none; padding:14px 28px; 
  font-weight:700; border-radius:8px; cursor:pointer; font-size:16px;
  transition: all 0.3s;
}
.btn:hover { transform:translateY(-1px); box-shadow:0 8px 20px rgba(255,149,0,0.4); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
@media (max-width:900px) { 
  .editor { grid-template-columns:1fr; } 
  .form-section { order:2; }
}
</style>
